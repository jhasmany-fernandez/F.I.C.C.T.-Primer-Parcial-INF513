services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: proyectoemail-app
    env_file:
      - .env
    environment:
      PROYECTOEMAIL_DB_HOST: ${PROYECTOEMAIL_DOCKER_DB_HOST:-host.docker.internal}
      PROYECTOEMAIL_DB_PORT: ${PROYECTOEMAIL_DOCKER_DB_PORT:-15432}
      PROYECTOEMAIL_DB_NAME: ${PROYECTOEMAIL_DB_NAME:-db_grupo27sa}
      PROYECTOEMAIL_DB_USER: ${PROYECTOEMAIL_DB_USER:-grupo27sa}
      PROYECTOEMAIL_DB_PASSWORD: ${PROYECTOEMAIL_DB_PASSWORD:-grupo27sa}
      PROYECTOEMAIL_POP3_HOST: ${PROYECTOEMAIL_POP3_HOST:-mail.tecnoweb.org.bo}
      PROYECTOEMAIL_POP3_PORT: ${PROYECTOEMAIL_POP3_PORT:-110}
      PROYECTOEMAIL_POP3_USER: ${PROYECTOEMAIL_POP3_USER:-}
      PROYECTOEMAIL_POP3_PASSWORD: ${PROYECTOEMAIL_POP3_PASSWORD:-}
      PROYECTOEMAIL_SMTP_HOST: ${PROYECTOEMAIL_SMTP_HOST:-mail.tecnoweb.org.bo}
      PROYECTOEMAIL_SMTP_PORT: ${PROYECTOEMAIL_SMTP_PORT:-25}
      PROYECTOEMAIL_SMTP_FROM: ${PROYECTOEMAIL_SMTP_FROM:-}
      PROYECTOEMAIL_PAGOFACIL_BASE_URL: ${PROYECTOEMAIL_PAGOFACIL_BASE_URL:-https://masterqr.pagofacil.com.bo/api/services/v2}
      PROYECTOEMAIL_PAGOFACIL_TOKEN_SERVICE: ${PROYECTOEMAIL_PAGOFACIL_TOKEN_SERVICE:-}
      PROYECTOEMAIL_PAGOFACIL_TOKEN_SECRET: ${PROYECTOEMAIL_PAGOFACIL_TOKEN_SECRET:-}
      PROYECTOEMAIL_PAGOFACIL_CALLBACK_URL: ${PROYECTOEMAIL_PAGOFACIL_CALLBACK_URL:-https://example.com/pagofacil-demo-callback}
      PROYECTOEMAIL_PAGOFACIL_PAYMENT_METHOD: ${PROYECTOEMAIL_PAGOFACIL_PAYMENT_METHOD:-34}
      PROYECTOEMAIL_PAGOFACIL_DOCUMENT_TYPE: ${PROYECTOEMAIL_PAGOFACIL_DOCUMENT_TYPE:-1}
      PROYECTOEMAIL_PAGOFACIL_CURRENCY: ${PROYECTOEMAIL_PAGOFACIL_CURRENCY:-2}
      PROYECTOEMAIL_PAGOFACIL_TIMEOUT_MS: ${PROYECTOEMAIL_PAGOFACIL_TIMEOUT_MS:-15000}
      PROYECTOEMAIL_CALLBACK_ENABLED: ${PROYECTOEMAIL_CALLBACK_ENABLED:-false}
      PROYECTOEMAIL_CALLBACK_PORT: ${PROYECTOEMAIL_CALLBACK_PORT:-8085}
      PROYECTOEMAIL_CALLBACK_PATH: ${PROYECTOEMAIL_CALLBACK_PATH:-/pagofacil/callback}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROYECTOEMAIL_CALLBACK_PORT:-8085}:${PROYECTOEMAIL_CALLBACK_PORT:-8085}"
    restart: unless-stopped
