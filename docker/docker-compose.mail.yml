services:
  greenmail:
    image: greenmail/standalone:2.1.1
    container_name: proyectoemail-greenmail
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp.pop3 -Dgreenmail.auth.disabled=true -Dgreenmail.users=grupo13sc:123456@tecnoweb.org.bo -Dgreenmail.users.login=local_part -Dgreenmail.smtp.hostname=0.0.0.0 -Dgreenmail.smtp.port=3025 -Dgreenmail.pop3.hostname=0.0.0.0 -Dgreenmail.pop3.port=3110"
    ports:
      - "3025:3025"
      - "3110:3110"
    restart: unless-stopped
